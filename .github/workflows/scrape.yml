name: "Scrape Ultimate Shop"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # every day at midnight UTC
  workflow_dispatch: {}

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Build
        run: go build -v ./...
      - name: Run scraper
        run: |
          go run main.go
